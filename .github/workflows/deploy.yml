
name: Terraform Apply and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform/environments/dev
  ECR_REPOSITORY: simple-webapp-flask-dev
  ECS_CLUSTER: simple-webapp-flask-dev
  ECS_SERVICE: simple-webapp-flask-dev

jobs:

  # ============================================================
  # 1. Terraform - Infrastructure
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve


  # ============================================================
  # 2. Docker Build + Push to ECR
  # ============================================================
  docker-build-push:
    name: Build and Push Docker Image
    needs: terraform-apply
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Get AWS Account ID
        id: aws-account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        id: image
        run: |
          ECR_URI="${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE_URI="${ECR_URI}:${GITHUB_SHA}"

          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Image URI: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image_uri }}" \
            .

      - name: Verify Docker image
        run: |
          docker images

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"


  # ============================================================
  # 3. Register New ECS Task Definition + Deploy
  # ============================================================
  deploy-ecs:
    name: Deploy to ECS
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Update image in task definition
        env:
          IMAGE_URI: ${{ needs.docker-build-push.outputs.image_uri }}
        run: |
          jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE
             | del(
                 .taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy
               )' \
            task-definition.json > new-task-definition.json

      - name: Register new ECS task definition
        id: task-definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

          echo "New task definition:"
          echo "$TASK_DEFINITION_ARN"

      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.task_definition_arn }}" \
            --desired-count 1 \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECS deployment
        run: |
          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

          echo "ECS service is stable."


  # ============================================================
  # 4. Post Deployment Health Check
  # ============================================================
  health-check:
    name: Post Deployment Health Check
    needs: deploy-ecs
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region "$AWS_REGION" \
            --query "LoadBalancers[?LoadBalancerName=='simple-webapp-flask-dev-alb'].DNSName" \
            --output text)

          echo "ALB DNS: $ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          HEALTH_URL="http://${{ steps.alb.outputs.alb_dns }}/health"

          echo "Checking: $HEALTH_URL"

          for i in {1..10}; do
            echo "Health check attempt $i/10..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$HEALTH_URL"; then

              echo ""
              echo "=========================================="
              echo "Application health check PASSED"
              echo "=========================================="
              exit 0
            fi

            echo "Application not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo ""
          echo "=========================================="
          echo "Application health check FAILED"
          echo "=========================================="

          exit 1

